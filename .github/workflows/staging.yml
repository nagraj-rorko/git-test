name: Harborline staging

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript
        run: node --check public/app.js && node --check server.js
      - name: Smoke test server
        shell: bash
        run: |
          node server.js &
          pid=$!
          trap 'kill "$pid"' EXIT
          for attempt in {1..10}; do
            curl --fail --silent http://localhost:3000/ && break
            sleep 1
          done
          curl --fail --silent http://localhost:3000/styles.css >/dev/null
          curl --fail --silent -X POST http://localhost:3000/api/contact \
            -H 'content-type: application/json' \
            -d '{"name":"CI","email":"ci@example.com"}' >/dev/null
